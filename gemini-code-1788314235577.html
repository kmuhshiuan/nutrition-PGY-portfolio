<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGY 學習歷程規劃系統</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-layout">
        
        <aside class="sidebar">
            <div class="logo">PGY 訓練平台</div>
            <nav class="menu">
                <ul>
                    <li class="active">儀表板</li>
                    <li>學習計劃</li>
                    <li>EPA & 評量</li>
                    <li>我的評核</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            
            <header class="header">
                <div class="user-info">王小明 (學員) | PGY1 | 第 7 階段 (M7)</div>
            </header>

            <div class="page-title-banner">
                <h1>王小明 (學員) - PGY 學習歷程規劃與訓練進度追蹤</h1>
            </div>

            <div class="dashboard-grid">
                
                <div class="kpi-card">EPA 平均 3.5 / 5</div>
                <div class="kpi-card">Milestones 進展 3.2 / 5</div>
                <div class="kpi-card">階段性課程完成度 75%</div>
                <div class="kpi-card">已認證 EPA 3 / 8</div>

                <div class="chart-card radar-chart">
                    <h2>EPA 能力雷達圖 (詳細)</h2>
                    <canvas id="epaRadarChart"></canvas>
                </div>

                <div class="chart-card course-progress">階段性課程概覽</div>
                <div class="chart-card line-chart">Milestones 進展趨勢</div>
                <div class="chart-card activity-log">近期學習活動摘要</div>

            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
