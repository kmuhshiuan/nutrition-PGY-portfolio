<!-- 1. 上傳檔案按鈕 (支援圖片、PDF 或報告) -->
<div>
  <label class="block text-xs font-bold text-slate-700 mb-1">上傳照護佐證資料 (PDF/圖片)</label>
  <input type="file" id="evidenceFile" accept=".pdf,.png,.jpg" class="w-full text-xs border border-slate-300 rounded-lg p-2 bg-white file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
</div>

<!-- 2. 下載 CSV 歷程按鈕 -->
<button onclick="exportToCSV()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-lg transition">
  <i class="fa-solid fa-file-excel mr-1"></i> 匯出 CSV 歷程紀錄
</button>

<script>
// 純前端 CSV 下載邏輯
function exportToCSV() {
  const csvContent = "data:text/csv;charset=utf-8,\uFEFF" 
    + "週次,EPA項目,信賴等級,指導營養師\n"
    + "W28,ad-hoc EPA 3 重症單位營養照護,Level 4 獨立執行,陳資深營養師\n";
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "營養師PGY_學習歷程.csv");
  document.body.appendChild(link);
  link.click();
}
</script>
